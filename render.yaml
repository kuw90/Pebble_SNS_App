services:
  - type: web
    name: pebble-sns-app
    env: docker
    region: ohio
    plan: starter
    rootDir: app1
    dockerfilePath: docker/php-web/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: pebble-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        fromDatabase:
          name: pebble-mysql
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pebble-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pebble-mysql
          property: password

databases:
  - name: pebble-mysql
    databaseName: development
    user: student
    region: ohio
    plan: starter
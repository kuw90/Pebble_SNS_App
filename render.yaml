services:
  - type: web
    name: pebble-sns-app
    env: docker
    region: ohio
    plan: starter
    rootDir: 
    dockerfilePath: app1/docker/php-web/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: pebble-postgres
          property: connectionString

databases:
  - name: pebble-postgres
    databaseName: development
    user: student
    region: ohio
    plan: free